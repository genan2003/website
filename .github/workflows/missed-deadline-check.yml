name: Check PR Label

on:
  push:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to check"
        required: true
        type: number

jobs:
  check-label:
    name: Check for forbidden label
    runs-on: ubuntu-latest

    steps:
      - name: Get PR labels
        id: get-labels
        uses: actions/github-script@v7
        with:
          script: |
            const FORBIDDEN_LABEL = 'your-label-here'; // 👈 Change this to your label

            let prNumber;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(context.payload.inputs.pr_number);
            } else if (context.eventName === 'push') {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              if (prs.length === 0) {
                console.log(`ℹ️ No open PR found for commit ${context.sha}. Skipping label check.`);
                return;
              }
              prNumber = prs[0].number;
              console.log(`Found PR #${prNumber} for commit ${context.sha}`);
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = pr.labels.map(l => l.name);
            console.log(`PR #${prNumber} labels: ${labels.join(', ') || '(none)'}`);

            const hasLabel = labels.includes(FORBIDDEN_LABEL);
            core.setOutput('has_label', hasLabel.toString());

            if (hasLabel) {
              core.setFailed(`❌ PR #${prNumber} has the forbidden label "${FORBIDDEN_LABEL}". Remove it before merging.`);
            } else {
              console.log(`✅ PR #${prNumber} does not have the forbidden label "${FORBIDDEN_LABEL}".`);
            }
